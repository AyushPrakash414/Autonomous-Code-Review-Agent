version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: autonomous_review_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: autonomous_review
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  spring-backend:
    build:
      context: ../spring-backend
      dockerfile: Dockerfile
    container_name: autonomous_review_spring
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/autonomous_review
      AGENT_SERVICE_URL: http://agent-service:8000
    ports:
      - "8080:8080"

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    container_name: autonomous_review_agent_service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: autonomous_review_frontend
    restart: unless-stopped
    depends_on:
      - spring-backend
      - agent-service
    ports:
      - "3000:80"

volumes:
  mongo_data:
