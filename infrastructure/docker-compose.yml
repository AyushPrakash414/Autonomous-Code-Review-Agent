version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autonomous_review_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autonomous_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_review"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-backend:
    build:
      context: ../spring-backend
      dockerfile: Dockerfile
    container_name: autonomous_review_spring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/autonomous_review
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      AGENT_SERVICE_URL: http://agent-service:8000
    ports:
      - "8080:8080"

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    container_name: autonomous_review_agent_service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: autonomous_review_frontend
    restart: unless-stopped
    depends_on:
      - spring-backend
      - agent-service
    ports:
      - "3000:80"

volumes:
  postgres_data:
